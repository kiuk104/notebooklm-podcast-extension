name: Build podcast feed

on:
  push:
    paths:
      - 'docs/episodes/**'
      - 'docs/podcast.json'
      - 'scripts/build_feed.py'
      - 'scripts/transcode.py'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ubuntu-latest 가 22.04 → 24.04 로 업그레이드되면서 ffmpeg 가 default
      # 설치에서 빠짐 (FileNotFoundError: 'ffmpeg' 로 fail). 명시 설치해야 안정.
      # 캐시 update 생략하고 바로 install — apt 가 알아서 최신 ffmpeg + libmp3lame.
      - name: Install ffmpeg (for transcode)
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      # podcast.json 의 transcode.enabled 가 true 일 때만 실제 변환. enabled=false
      # 면 no-op (transcode.py 가 빠져나감).
      - name: Transcode m4a/mp4 → mp3 (if enabled)
        run: python scripts/transcode.py

      - name: Build feed.xml
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/build_feed.py

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # docs/episodes/ 에서 retention 으로 삭제된 파일도 stage 되도록 -A.
          git add -A docs/feed.xml docs/episodes
          if git diff --cached --quiet; then
            echo 'feed unchanged, skipping commit'
          else
            git commit -m 'auto: rebuild feed'
            git push
          fi
