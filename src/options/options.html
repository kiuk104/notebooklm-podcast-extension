<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NotebookLM Podcast Sync — 설정</title>
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 13px; }
  label { display: block; margin-top: 18px; font-size: 13px; font-weight: 600; }
  input, select { width: 100%; padding: 8px 10px; margin-top: 4px; box-sizing: border-box; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; background: #fff; }
  button { margin-top: 22px; padding: 10px 20px; font-size: 14px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  .hint { font-size: 11px; color: #666; margin-top: 4px; font-weight: normal; }
  .hint a { color: #2563eb; }
  .status { margin-top: 14px; font-size: 13px; padding: 8px 12px; border-radius: 4px; }
  .status.success { background: #dcfce7; color: #166534; }
  .status.error { background: #fee2e2; color: #991b1b; }

  .task-panel { margin: 16px 0 0; padding: 12px 14px; border-radius: 6px; background: #f9fafb; border: 1px solid #e5e7eb; }
  .task-panel.running { background: #eff6ff; border-color: #93c5fd; }
  .task-panel.completed { background: #f0fdf4; border-color: #86efac; }
  .task-panel.failed { background: #fef2f2; border-color: #fca5a5; }
  .task-panel .task-head { display: flex; align-items: baseline; gap: 8px; }
  .task-panel .task-title { font-size: 13px; font-weight: 600; color: #111; }
  .task-panel .task-status { font-size: 11px; padding: 2px 6px; border-radius: 3px; background: #e5e7eb; color: #444; }
  .task-panel.running .task-status { background: #2563eb; color: #fff; }
  .task-panel.completed .task-status { background: #16a34a; color: #fff; }
  .task-panel.failed .task-status { background: #dc2626; color: #fff; }
  .task-panel .task-elapsed { font-size: 11px; color: #888; margin-left: auto; font-variant-numeric: tabular-nums; }
  .task-panel .task-message { font-size: 12px; color: #444; margin-top: 6px; min-height: 14px; }
  .progress-track { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin: 8px 0 6px; }
  .progress-fill { height: 100%; background: #2563eb; transition: width 0.4s ease; }
  .task-panel.completed .progress-fill { background: #16a34a; }
  .task-panel.failed .progress-fill { background: #dc2626; }
  .task-stats { font-size: 11px; color: #555; margin-top: 4px; }
  .task-errors { margin-top: 8px; font-size: 11px; color: #991b1b; max-height: 100px; overflow-y: auto; padding: 4px 8px; background: #fff; border: 1px solid #fecaca; border-radius: 4px; }
  .task-errors div { padding: 2px 0; border-bottom: 1px solid #fee2e2; }
  .task-errors div:last-child { border-bottom: 0; }
  .task-actions { margin-top: 10px; display: flex; gap: 6px; }
  .task-actions button { padding: 4px 10px; font-size: 11px; background: #fff; color: #444; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; margin-top: 0; }
  .task-actions button:hover { background: #f9fafb; }
</style>
</head>
<body>
<h1>NotebookLM Podcast Sync 설정</h1>
<p class="sub">받은 음성개요를 자동으로 push 할 GitHub repo 와 token 을 등록하세요.</p>

<!-- 진행 모니터 — 모든 노트북 스캔 / 일괄 다운로드 작업 진행 상황. -->
<!-- background SW 가 currentTaskState 를 chrome.storage.session 에 저장하므로 -->
<!-- 옵션 페이지를 닫았다 다시 열어도 진행 중이면 그대로 보입니다. -->
<div class="task-panel" id="task-panel" style="display:none">
  <div class="task-head">
    <span class="task-title" id="task-title">진행 중인 작업</span>
    <span class="task-status" id="task-status">대기</span>
    <span class="task-elapsed" id="task-elapsed"></span>
  </div>
  <div class="task-message" id="task-message"></div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="task-stats" id="task-stats"></div>
  <div class="task-errors" id="task-errors" style="display:none"></div>
  <div class="task-actions" id="task-actions" style="display:none">
    <button type="button" id="task-clear">초기화</button>
  </div>
</div>

<form id="form">
  <label>GitHub Personal Access Token
    <div style="display: flex; gap: 6px; margin-top: 4px;">
      <input type="password" id="token" placeholder="ghp_…" required autocomplete="off" style="margin-top: 0; flex: 1;">
      <button type="button" id="toggle-token" title="토큰 보이기/숨기기" aria-label="토큰 보이기/숨기기"
              style="margin-top: 0; padding: 0 12px; font-size: 14px; background: #fff; color: #2563eb; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">👁</button>
    </div>
    <div class="hint">
      <a href="https://github.com/settings/tokens/new?scopes=repo&description=notebooklm-podcast-extension" target="_blank">새 token 발급</a>
      — `repo` scope 필요. 토큰은 이 브라우저에만 저장되고 외부로 나가지 않습니다.
    </div>
  </label>

  <label>Repo (owner/name)
    <input type="text" id="repo" placeholder="kiuk104/my-notebooklm-podcast" required autocomplete="off">
    <div class="hint">아직 없으면 GitHub 에서 빈 public repo 를 먼저 만들고 입력하세요. Pages 활성화는 README 참고.</div>
  </label>

  <label>내 RSS feed URL
    <div style="display:flex; gap:6px; margin-top:4px; align-items:stretch;">
      <input type="text" id="feed-url" readonly placeholder="repo 를 먼저 입력하세요"
             style="margin-top:0; flex:1; background:#f9fafb; color:#111; cursor:text;">
      <button type="button" id="copy-feed" title="클립보드에 복사"
              style="margin-top:0; padding:0 14px; background:#fff; color:#2563eb; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:12px; white-space:nowrap;">복사</button>
      <a id="open-feed" href="#" target="_blank" rel="noopener" title="새 탭에서 열기"
         style="display:flex; align-items:center; padding:0 14px; background:#fff; color:#2563eb; border:1px solid #ccc; border-radius:4px; text-decoration:none; font-size:12px; pointer-events:none; opacity:0.4;">열기 ↗</a>
    </div>
    <div class="hint">
      팟캐스트 앱에 등록할 주소. <strong>repo 의 GitHub Pages 활성화 + 첫 빌드</strong> 후 200 응답합니다.
      custom domain 사용 시 <code>docs/podcast.json</code> 의 <code>baseUrl</code> 이 실제 주소 — 그땐 직접 확인.
    </div>
  </label>

  <label>RSS feed 생성 방식
    <select id="rss-mode">
      <option value="actions">GitHub Actions 에 위임 (권장)</option>
      <option value="extension">익스텐션이 매 push 시마다 직접 생성</option>
    </select>
    <div class="hint">
      기본값은 위임. repo 에 워크플로 (`.github/workflows/build-feed.yml`) 를 두면 audio 가 push 될 때마다 GitHub 가 `feed.xml` 을 자동 생성합니다.
      익스텐션 직접 생성 모드는 매 push 마다 episodes 디렉터리를 list + feed.xml PUT 까지 한 번에 처리 — 워크플로 셋업이 부담스러울 때 선택.
    </div>
  </label>

  <label>커밋 시 사용할 이름 / 이메일 (선택)
    <input type="text" id="committer-name" placeholder="kiuk104">
    <input type="email" id="committer-email" placeholder="kiuk104@gmail.com" style="margin-top:6px">
    <div class="hint">비워 두면 GitHub 기본값을 사용합니다.</div>
  </label>

  <div style="display: flex; gap: 10px; align-items: center;">
    <button type="submit">저장</button>
    <button type="button" id="verify" style="background: #fff; color: #2563eb; border: 1px solid #2563eb;">설정 검증</button>
  </div>
  <div id="status" class="status" style="display:none"></div>
</form>

<p style="margin-top: 28px; font-size: 12px; color: #666;">
  처음 사용하시나요? <a href="../help/help.html" target="_blank">도움말 페이지</a> 에 GitHub repo 셋업 / Pages 활성화 / RSS feed 생성 방법이 있습니다.
</p>

<script src="options.js"></script>
</body>
</html>
