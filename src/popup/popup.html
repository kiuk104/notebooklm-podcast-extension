<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NotebookLM Podcast Sync</title>
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; width: 320px; padding: 14px; margin: 0; color: #222; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.sub { font-size: 11px; color: #666; margin: 0 0 12px; }
  button { width: 100%; padding: 10px 14px; font-size: 13px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 12px; line-height: 1.5; color: #444; padding: 8px 10px; border-radius: 4px; background: #f4f4f4; min-height: 16px; }
  .status.error { background: #fee2e2; color: #991b1b; }
  .status.success { background: #dcfce7; color: #166534; }
  a.settings { display: block; text-align: center; margin-top: 10px; font-size: 11px; color: #2563eb; text-decoration: none; }
  a.settings:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>NotebookLM Podcast Sync</h1>
<p class="sub">v0.1.0 · 스켈레톤</p>
<button id="scan">현재 노트북 스캔</button>
<div class="status" id="status"></div>
<a href="#" class="settings" id="open-options">⚙ GitHub 설정</a>
<script src="popup.js"></script>
</body>
</html>
