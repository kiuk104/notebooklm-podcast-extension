<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NotebookLM Podcast Sync</title>
<style>
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; width: 380px; padding: 14px; margin: 0; color: #222; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p.sub { font-size: 11px; color: #666; margin: 0 0 10px; }
  button.primary { width: 100%; padding: 9px 14px; font-size: 13px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  button.primary:disabled { background: #9ca3af; cursor: not-allowed; }
  button.secondary { width: 100%; padding: 7px 14px; font-size: 12px; background: #fff; color: #2563eb; border: 1px solid #2563eb; border-radius: 6px; cursor: pointer; margin-top: 6px; }
  button.secondary:hover:not(:disabled) { background: #eff6ff; }
  button.secondary:disabled { color: #9ca3af; border-color: #d1d5db; cursor: not-allowed; }
  .status { margin-top: 10px; font-size: 12px; line-height: 1.45; color: #444; padding: 8px 10px; border-radius: 4px; background: #f4f4f4; min-height: 14px; white-space: pre-wrap; }
  .status.error { background: #fee2e2; color: #991b1b; }
  .status.success { background: #dcfce7; color: #166534; }
  .cover { margin-top: 10px; font-size: 12px; color: #444; }
  .cover .nb-title { font-weight: 600; color: #111; }
  .cover .nb-date { color: #888; font-size: 11px; }
  .bulk-bar { display: none; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 8px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; font-size: 11px; color: #444; }
  .bulk-bar label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .bulk-bar .spacer { flex: 1; }
  .bulk-bar button { padding: 4px 10px; font-size: 11px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  .bulk-bar button:hover:not(:disabled) { background: #1d4ed8; }
  .bulk-bar button:disabled { background: #9ca3af; cursor: not-allowed; }
  ul.cards { list-style: none; padding: 0; margin: 8px 0 0; max-height: 420px; overflow-y: auto; }
  ul.cards li { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 12px; }
  ul.cards li:last-child { border-bottom: 0; }
  ul.cards li.nb-header { display: block; padding: 8px 4px 4px; background: #f9fafb; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; font-size: 11px; color: #444; font-weight: 600; }
  ul.cards li.nb-header .nb-h-title { color: #111; }
  ul.cards li.nb-header .nb-h-date { color: #888; font-size: 10px; font-weight: normal; margin-left: 4px; }
  ul.cards li.nb-header .nb-h-empty { color: #9ca3af; font-weight: normal; font-size: 10px; margin-left: 6px; }
  ul.cards input.sel { margin: 0; cursor: pointer; }
  ul.cards input.sel:disabled { cursor: not-allowed; }
  ul.cards .ep-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.cards .ep-state { font-size: 10px; color: #666; min-width: 50px; text-align: right; }
  ul.cards .ep-state.ok { color: #166534; }
  ul.cards .ep-state.err { color: #991b1b; }
  ul.cards .ep-state.muted { color: #9ca3af; }
  ul.cards button.dl { padding: 4px 8px; font-size: 11px; background: #fff; color: #2563eb; border: 1px solid #2563eb; border-radius: 4px; cursor: pointer; }
  ul.cards button.dl:hover:not(:disabled) { background: #eff6ff; }
  ul.cards button.dl:disabled { color: #9ca3af; border-color: #d1d5db; cursor: not-allowed; }
  a.settings { display: block; text-align: center; margin-top: 10px; font-size: 11px; color: #2563eb; text-decoration: none; }
  a.settings:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>NotebookLM Podcast Sync</h1>
<p class="sub" id="version-line" data-i18n="popup.subtitle">push + RSS + retention + transcode</p>
<button id="scan" class="primary" data-i18n="popup.scan">현재 노트북 스캔</button>
<button id="scan-all" class="secondary" data-i18n="popup.scanAll">모든 노트북 스캔</button>
<div class="status" id="status"></div>
<div class="cover" id="cover" style="display:none">
  <div class="nb-title" id="nb-title"></div>
  <div class="nb-date" id="nb-date"></div>
</div>
<div class="bulk-bar" id="bulk-bar">
  <label><input type="checkbox" id="select-all"> <span data-i18n="popup.bulkSelectAll">전체 선택</span></label>
  <span class="spacer"></span>
  <button id="bulk-dl" disabled>선택 받기 (0)</button>
</div>
<ul class="cards" id="cards"></ul>
<a href="#" class="settings" id="open-options" data-i18n="popup.openOptions">⚙ 관리</a>
<a href="#" class="settings" id="open-help" data-i18n="popup.openHelp">❓ 도움말</a>
<script src="../i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
